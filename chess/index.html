<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>瘋狂象棋</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2b2118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="瘋狂象棋">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header>
  <a href="../index.html">← 選單</a>
  <span id="turn"></span>
  <span><button id="quick" title="快速模式：點綠點立即出發，不需確認">⚡快速</button> <button id="camBtn" title="重置視角（3D）" hidden>🎥</button> <button id="fsBtn" title="全螢幕" hidden>⛶</button> <button id="mute" title="音效開關">🔊</button> <button id="menu" title="對戰模式／重新開始">☰</button></span>
</header>
<div id="bar"><div id="info"></div><button id="fire" hidden>出發</button><button id="undo" hidden>↩ 取消移動</button><button id="skip" disabled>不射擊</button></div>
<canvas id="cv"></canvas>
<div id="perksBar"><button id="perkBtn" hidden>🃏 我的強化</button><span id="perks"></span></div>
<table id="legend"></table>
<div id="toast"></div>
<div id="cardPick" hidden><div class="pbox" id="cardBox"><h2 id="cardTitle"></h2><div class="sub" id="cardSub"></div><div id="cardList"></div></div></div>
<div id="perkOv" hidden><div class="pbox"><h2>🃏 我的強化</h2><div class="tabs"><button id="pTab0">紅方</button><button id="pTab1">黑方</button></div><div id="perkBody"></div><button id="perkClose" style="width:100%;margin-top:8px">關閉</button></div></div>
<div id="logOv" hidden><div class="pbox"><h2>📋 更新內容</h2><div id="logBody"></div><button id="logClose" style="width:100%;margin-top:8px">知道了</button></div></div>
<div id="installOv" hidden><div class="pbox"><h2>📲 加到主畫面</h2><ol id="instSteps"></ol>
  <div class="sub">遊戲連結（也可以分享給朋友）：<br><b id="instUrl"></b></div>
  <button id="instCopy" style="width:100%;margin-top:8px">🔗 複製遊戲連結</button><button id="instClose" style="width:100%;margin-top:8px">關閉</button></div></div>
<div id="tipCard" hidden><div id="tipTxt"></div><div class="tipRow"><a id="tipGo" class="btnlink" href="#" target="_blank" rel="noopener noreferrer"></a><button id="tipNo"></button></div></div>
<button id="newver" hidden>🆕 有新版本，點此更新</button>
<div id="lobby" hidden><div class="box">
  <div class="lhead"><h2>對戰模式</h2><button id="mClose" title="關閉">✕</button></div>
  <button id="mCards">🃏 強化卡牌：開<br><small>開局與定期三選一強化（連線以房主為準）</small></button>
  <button id="mLocal">📱 同裝置・並排<br><small>兩人輪流用同一支手機／電腦</small></button>
  <button id="mFace">🔄 同裝置・面對面<br><small>平板放桌上，兩人對坐，黑方文字倒轉</small></button>
  <h3>🤖 與電腦對戰（我執紅先手）</h3>
  <div class="row lv">
    <button data-lv="1">1<br>新手</button><button data-lv="2">2<br>簡單</button><button data-lv="3">3<br>普通</button><button data-lv="4">4<br>困難</button><button data-lv="5">5<br>大師</button>
  </div>
  <button id="mRestart">↺ 重新開始這局</button>
  <details class="sec" id="secNet"><summary>🌐 兩台裝置連線</summary>
    <button id="mHost">建立房間（我執紅先手）</button>
    <div class="row"><input id="roomIn" inputmode="numeric" maxlength="4" placeholder="輸入 4 位數房號"><button id="mJoin">加入（執黑）</button></div>
    <div id="netStatus"></div>
  </details>
  <details class="sec" id="secCards"><summary>🃏 強化卡牌設定</summary>
    <button id="mEvery">⏱ 每 10 回合選一次卡（點一下切換）</button>
    <div class="note">卡牌分四個等級：★ 普通、★★ 稀有、★★★ 瘋狂、✨ 終極魔法。選過的卡越多，越容易出現高等級；終極魔法要到第 4 次選牌後才有機會。連線時以房主的設定為準。</div>
  </details>
  <details class="sec" id="secView"><summary>🎥 畫面設定</summary>
    <div class="row"><button id="v3d">立體 3D</button><button id="v2d">平面 2D</button></div>
    <div class="row" id="tiltRow" hidden><label class="tilt">視角傾斜 <input id="tilt" type="range" min="25" max="75" step="5" value="45"> <span id="tiltV">45°</span></label></div>
    <button id="mRot" hidden>👆 手指旋轉視角：開</button>
  </details>
  <details class="sec" id="secMore"><summary>⚙️ 更多</summary>
    <button id="mInstall">📲 加到手機主畫面／安裝<br><small>之後點圖示就能玩，還是沒有網址列的全螢幕</small></button>
    <a id="mTip" class="btnlink" href="https://service.jkopay.com/r/transfer?j=Transfer:900386051&amp;amount=50" target="_blank" rel="noopener noreferrer">🍜 請作者吃碗滷肉飯<br><small>純屬好玩！不給也能玩到爆，給了作者會多寫一個瘋狂武器（大概）</small></a>
    <button id="mLog">📋 更新內容</button>
    <button id="mReload">🔄 重新整理（載入最新版）</button>
    <div id="ver"></div>
  </details>
</div></div>
<script src="js/config.js?v=2026-10-19.14"></script>
<script src="js/audio.js?v=2026-10-19.14"></script>
<script src="js/particles.js?v=2026-10-19.14"></script>
<script src="js/physics.js?v=2026-10-19.14"></script>
<script src="js/movement.js?v=2026-10-19.14"></script>
<script src="js/combat.js?v=2026-10-19.14"></script>
<script src="js/turn.js?v=2026-10-19.14"></script>
<script src="js/input.js?v=2026-10-19.14"></script>
<script src="js/render.js?v=2026-10-19.14"></script>
<script src="js/render3d.js?v=2026-10-19.14"></script>
<script src="js/ultimate.js?v=2026-10-19.14"></script>
<script src="js/view3d.js?v=2026-10-19.14"></script>
<script src="js/ai.js?v=2026-10-19.14"></script>
<script src="js/cards.js?v=2026-10-19.14"></script>
<script src="js/changelog.js?v=2026-10-19.14"></script>
<script src="js/version.js?v=2026-10-19.14"></script>
<script src="js/update.js?v=2026-10-19.14"></script>
<script src="js/pwa.js?v=2026-10-19.14"></script>
<script src="js/tip.js?v=2026-10-19.14"></script>
<script src="js/network.js?v=2026-10-19.14"></script>
<script src="js/main.js?v=2026-10-19.14"></script>
</body>
</html>
