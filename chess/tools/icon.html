<!doctype html>
<meta charset="utf-8">
<!-- 產生 3D 圖示用的頁面（由 make_icons.js 開啟並截圖，不是遊戲的一部分）：?size=512&mask=0|1 -->
<body style="margin:0;background:#2b2118">
<canvas id="c"></canvas>
<script type="module">
import * as T from '../vendor/three.min.js';
const q = new URLSearchParams(location.search), S = +q.get('size') || 512, mask = q.get('mask') === '1';
const cv = document.getElementById('c'); cv.width = cv.height = S; cv.style.cssText = `width:${S}px;height:${S}px;display:block`;
const r = new T.WebGLRenderer({ canvas: cv, antialias: true }); r.setPixelRatio(1); r.setSize(S, S, false); r.setClearColor(0x2b2118); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(), cam = new T.PerspectiveCamera(30, 1, 0.1, 100);
// 棋盤地面：暖色木紋底＋象棋格線＋四周暗角
const bc = document.createElement('canvas'); bc.width = bc.height = 1024; const b = bc.getContext('2d');
b.fillStyle = '#e6c88e'; b.fillRect(0, 0, 1024, 1024);
b.strokeStyle = '#6b442388'; b.lineWidth = 5; for (let i = -2; i <= 10; i++) { b.beginPath(); b.moveTo(i * 128, 0); b.lineTo(i * 128, 1024); b.moveTo(0, i * 128); b.lineTo(1024, i * 128); b.stroke(); }
b.beginPath(); b.moveTo(256, 256); b.lineTo(640, 640); b.moveTo(640, 256); b.lineTo(256, 640); b.stroke();
const bt = new T.CanvasTexture(bc); bt.colorSpace = T.SRGBColorSpace; bt.wrapS = bt.wrapT = 1000; bt.repeat.set(4, 4);   // 1000 = RepeatWrapping
const ground = new T.Mesh(new T.PlaneGeometry(36, 36), new T.MeshStandardMaterial({ map: bt, roughness: 0.9 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// 棋子（車形圓盤）：頂面「炮」字、紅色外環
const fc = document.createElement('canvas'); fc.width = fc.height = 512; const f = fc.getContext('2d');
f.fillStyle = '#f6e3b8'; f.fillRect(0, 0, 512, 512); f.strokeStyle = '#c0392b'; f.lineWidth = 26; f.beginPath(); f.arc(256, 256, 236, 0, 7); f.stroke(); f.lineWidth = 8; f.beginPath(); f.arc(256, 256, 198, 0, 7); f.stroke();
f.fillStyle = '#c0392b'; f.font = 'bold 290px "Noto Serif CJK TC","Noto Sans CJK TC",serif'; f.textAlign = 'center'; f.textBaseline = 'middle'; f.fillText('炮', 256, 272);
const ft = new T.CanvasTexture(fc); ft.colorSpace = T.SRGBColorSpace; ft.anisotropy = 8; ft.center.set(0.5, 0.5); ft.rotation = Math.PI / 2;
const piece = new T.Group(); scene.add(piece);
const side = new T.MeshStandardMaterial({ color: 0xe9d2a0, roughness: 0.45 }), rim = new T.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.4, metalness: 0.2 });
const disc = new T.Mesh(new T.CylinderGeometry(1, 1, 0.5, 64), [side, new T.MeshStandardMaterial({ map: ft, roughness: 0.4 }), side]); disc.position.y = 0.55; disc.castShadow = true; piece.add(disc);
const ring = new T.Mesh(new T.TorusGeometry(1.0, 0.06, 16, 64), rim); ring.rotation.x = Math.PI / 2; ring.position.y = 0.32; piece.add(ring);
const dark = new T.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.5, metalness: 0.4 });
for (const [x, z] of [[-0.55, -1.02], [0.55, -1.02], [-0.55, 1.02], [0.55, 1.02]]) { const w = new T.Mesh(new T.BoxGeometry(0.62, 0.42, 0.3), dark); w.position.set(x, 0.24, z); w.castShadow = true; piece.add(w); }
// 砲管：從圓盤右側伸出（不遮住頂面的字），砲口爆出火光
const gun = new T.Group(); gun.position.set(0.85, 0.62, 0.35); gun.rotation.set(0, 0.42, 0.1); piece.add(gun);
const barrel = new T.Mesh(new T.CylinderGeometry(0.2, 0.25, 1.5, 24), dark); barrel.rotation.z = -Math.PI / 2; barrel.position.x = 0.7; barrel.castShadow = true; gun.add(barrel);
const brake = new T.Mesh(new T.CylinderGeometry(0.31, 0.31, 0.26, 24), new T.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.35, metalness: 0.6 })); brake.rotation.z = -Math.PI / 2; brake.position.x = 1.5; gun.add(brake);
const glow = (r, c, o) => { const m = new T.Mesh(new T.SphereGeometry(r, 24, 16), new T.MeshBasicMaterial({ color: c, transparent: true, opacity: o })); m.position.x = 1.95; gun.add(m); };
glow(0.62, 0xff7a1a, 0.35); glow(0.45, 0xffa31f, 0.6); glow(0.28, 0xffe066, 0.95); glow(0.14, 0xffffff, 1);
for (let i = 0; i < 9; i++) {   // 放射狀火舌
  const a = i / 9 * Math.PI * 2, len = 0.55 + (i % 3) * 0.3, cone = new T.Mesh(new T.ConeGeometry(0.1, len, 8), new T.MeshBasicMaterial({ color: i % 2 ? 0xffb030 : 0xffe066 }));
  cone.position.set(1.95 + 0.25 + Math.cos(a) * 0.1, Math.sin(a) * len * 0.55 + Math.cos(a * 2) * 0.05, Math.cos(a) * len * 0.5);
  cone.rotation.z = -Math.PI / 2 + Math.sin(a) * 0.9; cone.rotation.x = Math.cos(a) * 0.9; gun.add(cone);
}
for (const [x, y, z, s] of [[2.7, 0.55, -0.4, 0.07], [2.55, -0.5, 0.45, 0.06], [3.0, 0.1, 0.2, 0.05], [2.45, 0.7, 0.5, 0.05]]) { const sp = new T.Mesh(new T.SphereGeometry(s, 10, 8), new T.MeshBasicMaterial({ color: 0xffe066 })); sp.position.set(x, y, z); gun.add(sp); }
piece.rotation.y = 0.0; piece.position.set(-0.55, 0, 0.0);
scene.add(new T.HemisphereLight(0xfff2d8, 0x6a4a2a, 1.3));
const sun = new T.DirectionalLight(0xffffff, 2.4); sun.position.set(-3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 }); sun.shadow.bias = -0.0005; scene.add(sun);
const el = 52 * Math.PI / 180, dist = (mask ? 12.6 : 9.6);
cam.position.set(0, Math.sin(el) * dist, Math.cos(el) * dist); cam.lookAt(0.35, 0.1, 0.35); cam.updateProjectionMatrix();
r.render(scene, cam); window.__done = true;
</script>
