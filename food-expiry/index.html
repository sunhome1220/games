<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食品效期記錄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#e8590c">
<style>
:root{--bg:#fff8ef;--fg:#2b2118;--card:#fff;--mut:#8a7a6b;--pri:#e8590c;--ok:#2f9e44;--warn:#f08c00;--bad:#e03131;--line:#eadfce}
@media(prefers-color-scheme:dark){:root{--bg:#1c1713;--fg:#f4ebe0;--card:#2a231c;--mut:#a39382;--line:#3d3329}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,"Noto Sans TC",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}
main{max-width:640px;margin:0 auto;padding:12px 16px 90px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.sm{padding:6px 10px;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:14px 20px;border-radius:30px;font-size:17px;box-shadow:0 4px 14px #0004;z-index:6}
.sum{display:flex;gap:8px;margin:4px 0 12px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}
.sum b{display:block;font-size:22px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.item.soon{border-left-color:var(--warn)}.item.exp{border-left-color:var(--bad)}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--mut)}
.badge{font-weight:700;font-size:14px;white-space:nowrap}
.soon .badge{color:var(--warn)}.exp .badge{color:var(--bad)}.item:not(.soon):not(.exp) .badge{color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
#cam{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3;margin-bottom:8px}
#cam video{width:100%;height:100%;object-fit:cover}
#cam:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:#f03e3eaa;box-shadow:0 0 8px #f03e3e}
.hint{font-size:13px;color:var(--mut)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<header><h1>🍱 食品效期記錄 <small id="ver" style="font-size:11px;opacity:.8;font-weight:400"></small></h1><button class="ghost sm" style="color:#fff;border-color:#fff" id="menuBtn">⋯</button></header>
<button id="newver" hidden style="width:100%;border-radius:0;background:#1971c2;position:sticky;top:48px;z-index:4">🔔 有新版本，點此更新</button>
<main>
  <div class="sum"><div>已過期<b id="nExp">0</b></div><div>3 天內<b id="nSoon">0</b></div><div>全部<b id="nAll">0</b></div></div>
  <div id="list"></div>
</main>
<button class="fab" id="scanBtn">📷 掃描條碼</button>

<dialog id="scanDlg">
  <div id="cam"><video playsinline muted></video></div>
  <div class="hint" id="scanMsg">把條碼對準紅線（需 HTTPS 與相機權限）</div>
  <label>或手動輸入條碼</label>
  <div class="row"><input id="manual" inputmode="numeric" placeholder="例：4710088412345"><button id="manualGo" style="flex:0 0 auto">確定</button></div>
  <div class="btns"><button class="ghost" id="scanClose">取消</button></div>
</dialog>

<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <h3 style="margin:0" id="itemTitle">新增食品</h3>
    <label>條碼</label><input id="fCode" inputmode="numeric">
    <label>名稱</label><input id="fName" required placeholder="查詢中…可自行修改">
    <div class="row">
      <div><label>有效期限</label><input id="fExp" type="date" required></div>
      <div><label>數量</label><input id="fQty" type="number" min="1" value="1"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="hint" id="fHint"></div>
    <div class="btns"><button type="button" class="ghost" id="itemCancel">取消</button><button type="submit">儲存</button></div>
  </form>
</dialog>

<dialog id="openDlg">
  <form method="dialog" id="openForm">
    <h3 style="margin:0" id="openTitle">開封</h3>
    <div class="hint" id="openSub"></div>
    <div class="row">
      <div><label>開封日期</label><input id="oDate" type="date" required></div>
      <div><label>開封後可放幾天</label><input id="oDays" type="number" min="1" max="3650" placeholder="例：7"></div>
    </div>
    <div class="quick" id="oQuick"></div>
    <div class="hint" id="oHint"></div>
    <div class="btns"><button type="button" class="ghost" id="oUndo" hidden>取消開封</button><button type="button" class="ghost" id="oCancel">關閉</button><button type="submit">確定</button></div>
  </form>
</dialog>

<dialog id="menuDlg">
  <h3 style="margin:0 0 8px">選單</h3>
  <div class="row"><button class="ghost" id="addManual">手動新增</button><button class="ghost" id="notifBtn">開啟到期提醒</button></div>
  <div class="row" style="margin-top:8px"><button class="ghost" id="exportBtn">匯出備份</button><button class="ghost" id="importBtn">匯入備份</button></div>
  <label>家庭共用（多人同步同一份清單）</label>
  <div class="hint" id="famStatus"></div>
  <div class="row" style="margin-top:6px"><button class="ghost" id="famJoin">加入／建立</button><button class="ghost" id="famShare" hidden>分享連結</button><button class="ghost" id="famLeave" hidden>離開</button></div>
  <label>常用保存天數（天，用逗號分隔）</label><input id="presetIn" placeholder="3,7,14,30,45,60,90,180,365">
  <label>幾天內算「快到期」</label><input id="soonDays" type="number" min="1" max="30">
  <input type="file" id="importFile" accept="application/json" hidden>
  <div class="btns"><button id="menuClose">關閉</button></div>
</dialog>

<script src="js/version.js?v=2026-11-05.02"></script>
<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=ls.get('fe.items',[]);      // {id,code,name,exp,qty}
let known=ls.get('fe.known',{});      // code -> {name,days}
let soonDays=ls.get('fe.soon',3);
const DEF_DAYS=[3,7,14,30,45,60,90,180,365];
let presets=ls.get('fe.presets',DEF_DAYS);
const save=()=>{ls.set('fe.items',items);ls.set('fe.known',known);ls.set('fe.soon',soonDays);ls.set('fe.presets',presets)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const toISO=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return toISO(d)};
const eff=it=>it.opened&&it.openDays?(addDays(it.opened,it.openDays)<it.exp?addDays(it.opened,it.openDays):it.exp):it.exp;
const daysLeft=e=>Math.round((new Date(e+'T00:00:00')-today())/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const L=items.slice().sort((a,b)=>eff(a).localeCompare(eff(b)));
  let ne=0,ns=0;
  $('#list').innerHTML=L.length?L.map(it=>{
    const E=eff(it),d=daysLeft(E),cls=d<0?'exp':d<=soonDays?'soon':'';
    if(d<0)ne++;else if(d<=soonDays)ns++;
    const t=d<0?`過期 ${-d} 天`:d===0?'今天到期':`剩 ${d} 天`;
    return `<div class="item ${cls}"><div class="info"><div class="nm">${esc(it.name)}${it.qty>1?' ×'+it.qty:''}</div><div class="meta">${it.opened?`🔓 ${it.opened} 開封${it.openDays?`，限 ${it.openDays} 天內吃完`:''}${E!==it.exp?'（原效期 '+it.exp+'）':''}`:'效期 '+it.exp}${it.code?' · '+esc(it.code):''}</div></div><div class="badge">${t}</div><button class="sm ghost" data-open="${it.id}">${it.opened?'開封中':'開封'}</button><button class="sm ghost" data-edit="${it.id}">編輯</button><button class="sm" data-done="${it.id}">用完</button></div>`}).join('')
    :'<div class="empty">還沒有記錄<br>按下方「掃描條碼」開始</div>';
  $('#nExp').textContent=ne;$('#nSoon').textContent=ns;$('#nAll').textContent=items.length;
}
$('#list').onclick=e=>{
  const d=e.target.dataset;
  if(d.done){const it=items.find(x=>x.id==d.done);if(confirm(`「${it.name}」已用完／丟棄？`)){items=items.filter(x=>x!==it);Sync.delItem(it.id);save();render()}}
  if(d.open)openOpened(items.find(x=>x.id==d.open));
  if(d.edit)openItem(items.find(x=>x.id==d.edit));
};

/* ---- 掃描 ---- */
let stream=null,scanning=false,zx=null;
async function startScan(){
  $('#scanDlg').showModal();$('#manual').value='';
  const msg=$('#scanMsg'),v=$('#cam video');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){msg.textContent='無法使用相機（'+(e.name||'錯誤')+'），請手動輸入條碼。';return}
  v.srcObject=stream;await v.play().catch(()=>{});
  msg.textContent='掃描中…';scanning=true;
  if('BarcodeDetector' in window){
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    const loop=async()=>{if(!scanning)return;
      try{const r=await det.detect(v);if(r.length){return found(r[0].rawValue)}}catch{}
      setTimeout(loop,200)};loop();
  }else{
    msg.textContent='載入掃描元件…';
    try{
      if(!window.ZXing)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='vendor/zxing.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
      const H=new Map();
      H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.QR_CODE]);
      H.set(ZXing.DecodeHintType.TRY_HARDER,true);
      zx=new ZXing.MultiFormatReader();zx.setHints(H);
      const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
      let n=0;
      const loop=()=>{if(!scanning)return;
        const w=v.videoWidth,h=v.videoHeight;
        if(w){
          // 交替掃整個畫面與中間橫帶（橫帶解析度較高、干擾少）
          const band=n++%2===1,sw=band?w*0.9:w,sh=band?h*0.4:h,sx=(w-sw)/2,sy=(h-sh)/2;
          const sc=Math.min(1,1000/sw);cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
          cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
          try{
            const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
            const r=zx.decodeWithState(bmp);if(r)return found(r.getText());
          }catch{}
        }
        setTimeout(loop,120)};loop();
    }catch{msg.textContent='此瀏覽器不支援掃描，請手動輸入條碼。'}
  }
}
function stopScan(){scanning=false;zx=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#cam video').srcObject=null}
function found(code){stopScan();navigator.vibrate&&navigator.vibrate(60);$('#scanDlg').close();newFromCode(code)}
$('#scanBtn').onclick=startScan;
$('#scanClose').onclick=()=>{stopScan();$('#scanDlg').close()};
$('#scanDlg').addEventListener('cancel',stopScan);
$('#manualGo').onclick=()=>{const c=$('#manual').value.trim();if(c){stopScan();$('#scanDlg').close();newFromCode(c)}};

/* ---- 新增／編輯 ---- */
let editing=null,lookupSeq=0;
async function newFromCode(code){
  openItem(null,code);
  const k=known[code];
  if(k){$('#fName').value=k.name;if(k.days)setExp(k.days);$('#fHint').textContent='已套用上次記錄的名稱與保存天數';return}
  const seq=++lookupSeq,H=$('#fHint');H.textContent='查詢商品資料中…';
  const nm=await lookupName(code);
  if(seq!==lookupSeq)return;
  if(nm.name&&!$('#fName').value){$('#fName').value=nm.name;H.textContent='名稱取自 '+nm.src+'，可自行修改'}
  else if(!nm.name){H.textContent=(nm.err?'無法連線查詢':'資料庫查無此商品（台灣商品收錄較少）')+'，請輸入名稱，下次掃同一條碼會自動帶出';$('#fName').focus()}
}
async function getJSON(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
async function lookupName(code){
  let err=true;
  try{ // Open Food Facts
    const j=await getJSON(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);err=false;
    const p=j.status===1&&j.product;
    if(p){const base=p.product_name_zh||p['product_name_zh-TW']||p['product_name_zh-Hant']||p.product_name||p.generic_name||p.abbreviated_product_name||'';
      const n=[(p.brands||'').split(',')[0],base,p.quantity].filter(Boolean).join(' ').trim();
      if(base)return{name:n,src:'Open Food Facts'}}
  }catch{}
  try{ // UPCitemdb（有些瀏覽器會擋跨網域，失敗就略過）
    const j=await getJSON(`https://api.upcitemdb.com/prod/trial/lookup?upc=${encodeURIComponent(code)}`);err=false;
    const it=j.items&&j.items[0];
    if(it&&it.title)return{name:it.title,src:'UPCitemdb'}
  }catch{}
  return{name:'',err};
}
const dayLabel=d=>d%365===0?d/365+'年':d%30===0&&d>=30?d/30+'個月':d%7===0&&d>=7?d/7+'週':d+'天';
function renderQuick(){
  $('#quick').innerHTML='<span class="hint" style="align-self:center">保存天數：</span>'+presets.map(d=>`<button type="button" class="sm ghost" data-d="${d}">${dayLabel(d)}</button>`).join('')
    +'<span style="display:flex;gap:4px;align-items:center"><input id="customDays" type="number" min="1" max="3650" placeholder="自訂" style="width:80px;padding:5px"><span class="hint">天</span><button type="button" class="sm" id="customGo">套用</button></span>';
}
function setExp(days){const d=today();d.setDate(d.getDate()+days);$('#fExp').value=toISO(d)}
function openItem(it,code=''){
  editing=it;lookupSeq++;
  $('#itemTitle').textContent=it?'編輯食品':'新增食品';
  $('#fCode').value=it?it.code:code;$('#fName').value=it?it.name:'';$('#fExp').value=it?it.exp:'';$('#fQty').value=it?it.qty:1;$('#fHint').textContent='';
  renderQuick();
  $('#itemDlg').showModal();
}
$('#quick').onclick=e=>{
  if(e.target.dataset.d)setExp(+e.target.dataset.d);
  if(e.target.id==='customGo'){const n=Math.round(+$('#customDays').value);if(n>=1&&n<=3650){setExp(n);if(!presets.includes(n)&&confirm(`把「${n} 天」加入常用保存天數？`)){presets=[...presets,n].sort((a,b)=>a-b);save();renderQuick()}}}
};
$('#itemCancel').onclick=()=>$('#itemDlg').close();
$('#itemForm').onsubmit=()=>{
  const code=$('#fCode').value.trim(),name=$('#fName').value.trim(),exp=$('#fExp').value,qty=Math.max(1,+$('#fQty').value||1);
  if(!name||!exp)return;
  let it=editing;
  if(it)Object.assign(it,{code,name,exp,qty});
  else{it={id:Date.now()+Math.random().toString(36).slice(2,6),code,name,exp,qty};items.push(it)}
  Sync.setItem(it);
  if(code){known[code]=Object.assign(known[code]||{},{name,days:Math.max(1,daysLeft(exp))});Sync.setKnown(code,known[code])}
  save();render();
};
/* ---- 開封 ---- */
let opening=null;
const OPEN_PRE=[1,3,5,7,14,30];
function openOpened(it){
  opening=it;
  $('#openTitle').textContent='開封：'+it.name;
  $('#openSub').textContent='原效期 '+it.exp+'；開封後以「開封日＋天數」與原效期較早者為準';
  const k=known[it.code]||{};
  $('#oDate').value=it.opened||toISO(new Date());
  $('#oDays').value=it.openDays||k.openDays||'';
  $('#oHint').textContent=!it.openDays&&k.openDays?'已套用上次記錄的開封後天數':'';
  $('#oQuick').innerHTML='<span class="hint" style="align-self:center">開封後：</span>'+OPEN_PRE.map(d=>`<button type="button" class="sm ghost" data-d="${d}">${dayLabel(d)}</button>`).join('');
  $('#oUndo').hidden=!it.opened;
  $('#openDlg').showModal();
}
$('#oQuick').onclick=e=>{if(e.target.dataset.d)$('#oDays').value=e.target.dataset.d};
$('#oCancel').onclick=()=>$('#openDlg').close();
$('#oUndo').onclick=()=>{delete opening.opened;delete opening.openDays;Sync.setItem(opening);save();render();$('#openDlg').close()};
$('#openForm').onsubmit=()=>{
  const days=Math.round(+$('#oDays').value)||0;
  opening.opened=$('#oDate').value;if(days)opening.openDays=days;else delete opening.openDays;
  Sync.setItem(opening);
  if(opening.code&&days){known[opening.code]=Object.assign(known[opening.code]||{name:opening.name},{openDays:days});Sync.setKnown(opening.code,known[opening.code])}
  save();render();
};
$('#addManual').onclick=()=>{$('#menuDlg').close();openItem(null)};

/* ---- 選單：備份／提醒 ---- */
$('#menuBtn').onclick=()=>{$('#soonDays').value=soonDays;$('#presetIn').value=presets.join(',');$('#menuDlg').showModal()};
$('#menuClose').onclick=()=>{soonDays=Math.min(30,Math.max(1,+$('#soonDays').value||3));
  const ps=[...new Set($('#presetIn').value.split(/[,，、\s]+/).map(Number).filter(n=>n>=1&&n<=3650).map(Math.round))].sort((a,b)=>a-b);presets=ps.length?ps:DEF_DAYS;save();render();$('#menuDlg').close()};
$('#exportBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({items,known},null,1)],{type:'application/json'}));
  a.download=`food-expiry-${toISO(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{
  try{const j=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(j.items))throw 0;
    if(confirm(`匯入 ${j.items.length} 筆，會取代目前的記錄，確定？`)){const old=items.map(i=>i.id);items=j.items;known=j.known||{};save();render();Sync.replaceAll(items,known,old)}
  }catch{alert('檔案格式不正確')}e.target.value=''};
function notifyDue(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const due=items.filter(i=>daysLeft(eff(i))<=soonDays);
  if(due.length&&ls.get('fe.lastNotify')!==toISO(new Date())){
    ls.set('fe.lastNotify',toISO(new Date()));
    new Notification('食品效期提醒',{body:due.slice(0,5).map(i=>i.name).join('、')+(due.length>5?` 等 ${due.length} 項`:'')+' 即將或已經到期',icon:'icon.svg'})}
}
$('#notifBtn').onclick=async()=>{
  if(!('Notification' in window))return alert('此瀏覽器不支援通知');
  const p=await Notification.requestPermission();
  alert(p==='granted'?'已開啟：每天第一次打開 App 時，會提醒快到期的食品':'未允許通知');notifyDue()};

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();notifyDue();
</script>
<script src="firebase-config.js"></script>
<script src="js/sync.js?v=2026-11-05.02"></script>
<script src="js/family.js?v=2026-11-05.02"></script>
<script src="js/update.js?v=2026-11-05.02"></script>
</body>
</html>
