<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>原型 B：回力車象棋・戰術瞄準</title>
<style>
  * { box-sizing:border-box; }
  /* 手機：禁止長按選字、放大鏡、系統選單與點擊高亮，避免干擾拖曳 */
  html, body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  button, a { touch-action:manipulation; }
  body { margin:0; background:#1f2a24; color:#eef3e8; font:15px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; max-width:560px; padding:8px 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
  header a { color:#e8c88a; text-decoration:none; }
  #turn { font-weight:700; font-size:18px; }
  #bar { width:100%; max-width:560px; padding:0 12px 6px; display:flex; gap:8px; align-items:flex-start; }
  #info { flex:1; min-height:2.8em; font-size:14px; }
  canvas { width:min(96vw, 560px, calc((100vh - 140px) * 540 / 596)); display:block; touch-action:none; border-radius:6px; box-shadow:0 4px 18px #0008; }
  button { background:#e8c88a; color:#2b2118; border:0; border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  #fire { background:#e74c3c; color:#fff; font-weight:700; }
  #undo { background:#5b7fa6; color:#fff; font-weight:700; }
  #quick.on { background:#f1c40f; font-weight:700; }
  #quick:not(.on) { opacity:.6; }
  header, header * { white-space:nowrap; }
  header span button { padding:6px 8px; font-size:14px; }
  #bar.flip { transform:rotate(180deg); }   /* 面對面：輪到黑方時訊息列轉向黑方 */
  #lobby { position:fixed; inset:0; background:#000b; display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #lobby[hidden] { display:none; }
  #lobby .box { background:#2b3a31; border:1px solid #4d6355; border-radius:10px; padding:18px; width:100%; max-width:380px; -webkit-user-select:text; user-select:text; }
  #lobby h2 { margin:0 0 12px; font-size:19px; color:#e8c88a; }
  #lobby h3 { margin:14px 0 6px; font-size:15px; color:#cfe0d4; }
  #lobby button { width:100%; margin:4px 0; text-align:left; }
  #lobby small { color:#a9bcaf; }
  #lobby button small { color:#6b5a3a; }
  #lobby .row { display:flex; gap:6px; }
  #lobby .row button { width:auto; white-space:nowrap; }
  #lobby .lv button { flex:1; padding:7px 0; text-align:center; font-size:14px; line-height:1.3; }
  #lobby input { flex:1; min-width:0; font:inherit; padding:6px 8px; border-radius:4px; border:0; }
  #newver { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:20; background:#2ecc71; color:#08311a;
            font-weight:700; box-shadow:0 4px 14px #0008; padding:10px 18px; border-radius:20px; }
  #newver[hidden] { display:none; }
  #ver { color:#a9bcaf; font-size:12px; text-align:right; margin-top:8px; }
  #cardPick, #logOv { position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:15; padding:14px; overflow:auto; }
  #logOv { z-index:30; }
  #cardPick[hidden], #logOv[hidden] { display:none; }
  .pbox { background:#2b3a31; border:1px solid #6b8a74; border-radius:12px; padding:16px; width:100%; max-width:400px; -webkit-user-select:none; user-select:none; }
  .pbox.flip { transform:rotate(180deg); }
  .pbox h2 { margin:0 0 4px; font-size:19px; color:#ffd166; text-align:center; }
  .pbox .sub { color:#a9bcaf; font-size:13px; text-align:center; margin-bottom:10px; }
  .cbtn { display:flex; gap:12px; align-items:center; width:100%; margin:8px 0; padding:10px 12px; text-align:left; background:#f3e2bd; border:2px solid #b8923f; border-radius:10px; color:#2b2118; }
  .cbtn:active { transform:scale(.98); background:#ffe9a8; }
  .cbtn .ic { font-size:34px; line-height:1; flex:none; width:44px; text-align:center; }
  .cbtn b { font-size:16px; display:block; }
  .cbtn span { font-size:13px; color:#5a4632; }
  .cbtn em { font-style:normal; font-size:11px; color:#a85a1a; }
  #perks { width:100%; max-width:560px; padding:2px 14px 0; font-size:12px; color:#b9cdbf; min-height:1.2em; }
  #perksBar { width:100%; max-width:560px; padding:0 14px; display:flex; gap:8px; align-items:center; }
  #perksBar button { flex:none; padding:4px 10px; font-size:13px; }
  #perksBar #perks { padding:0; flex:1; }
  #perkOv { position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:16; padding:14px; overflow:auto; }
  #perkOv[hidden] { display:none; }
  #perkOv .tabs { display:flex; gap:6px; margin:6px 0 8px; }
  #perkOv .tabs button { flex:1; padding:6px 0; opacity:.55; }
  #perkOv .tabs button.on { opacity:1; font-weight:700; }
  .pitem { display:flex; gap:12px; align-items:flex-start; background:#35483c; border:1px solid #587563; border-radius:10px; padding:9px 11px; margin:7px 0; }
  .pitem .ic { font-size:28px; width:38px; text-align:center; flex:none; }
  .pitem b { display:block; font-size:15px; color:#ffe39a; }
  .pitem span { font-size:13px; color:#dfe9e2; display:block; }
  .pitem em { font-style:normal; font-size:12px; color:#8fe0a8; display:block; margin-top:2px; }
  #perkOv .empty { text-align:center; color:#a9bcaf; padding:14px 0; font-size:14px; }
  #perkOv .next { text-align:center; color:#ffd166; font-size:13px; margin-top:6px; }
  #toast { position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:25; background:#ffd166; color:#3a2a00; font-weight:700; padding:8px 16px; border-radius:18px; box-shadow:0 4px 14px #0008; pointer-events:none; opacity:0; transition:opacity .25s; max-width:92vw; text-align:center; }
  #toast.on { opacity:1; }
  #logOv ul { margin:4px 0 10px; padding-left:20px; font-size:13.5px; color:#dfe9e2; }
  #logOv h3 { margin:12px 0 2px; font-size:15px; color:#ffd166; }
  #logOv h3 small { color:#8fa595; font-weight:400; }
  #netStatus { margin-top:10px; min-height:1.5em; color:#ffd166; font-size:14px; word-break:break-all; }
  table { margin:10px 0 20px; border-collapse:collapse; font-size:13px; }
  td, th { padding:3px 8px; border-bottom:1px solid #3d4f44; text-align:center; }
</style>

</header>
<div id="bar"><div id="info"></div><button id="fire" hidden>出發</button><button id="undo" hidden>↩ 取消移動</button><button id="skip" disabled>不射擊</button></div>

  <h2>對戰模式</h2>
  <button id="mCards">🃏 強化卡牌：開<br><small>開局與每 10 回合三選一強化（連線時以房主設定為準）</small></button>

    <button data-lv="1">1<br>新手</button><button data-lv="2">2<br>簡單</button><button data-lv="3">3<br>普通</button><button data-lv="4">4<br>困難</button><button data-lv="5">5<br>大師</button>
  </div>

<script>
// ===== 原型 B：移動 + 手動瞄準 =====
// 回合 = ① 拉動一台車（或輕點原地不動） ② 從射程內的敵人中點選目標開火。
// 直射武器會被中間的棋子擋住；炮為曲射可越過棋子但有最小射程。
// 河道泥濘（摩擦加倍），帥/將被限制在九宮內。
const C = 56, M = 46, W = C * 8 + M * 2, H = C * 9 + M * 2, R = 21;
const FR = 900, RIVER_FR = 2.6, MAXPULL = 120, E = 0.85, DPR = 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
// 擋掉長按選單／選字／捲動等瀏覽器預設手勢（pointer 事件仍正常觸發）
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('selectstart', e => e.preventDefault());
const gx = c => M + c * C, gy = r => M + r * C;

const SIDE = [{ name: '紅方', col: '#c0392b' }, { name: '黑方', col: '#1d1d1d' }];
const TYPES = {
  K: { n: ['帥', '將'], hp: 3, dist: 1.5 * C, range: 1.5 * C, min: 0,     dmg: 1, mass: 3,   w: '手槍',   snd: 'pistol', proj: 'bullet', palace: true },
  R: { n: ['俥', '車'], hp: 4, dist: 10 * C,   range: 4.2 * C, min: 0,     dmg: 2, mass: 2,   w: '機槍',   snd: 'mg',     proj: 'burst', reload: 1, backup: true, line: true, ortho: true },   // 只能沿橫線／直線移動；橫線、直線射程 5 格，斜對角只有 3 格
  N: { n: ['傌', '馬'], hp: 3, dist: 0, knight: true, range: 3 * C, min: 0,     dmg: 2, mass: 1.5, w: '火箭',   snd: 'rocket', proj: 'rocket', reload: 1, backup: true, knightOnly: true },   // 火箭只能打「日」字位置；近戰（任何時候）用 1 心步槍   // 射後需裝填 2 回合（期間改用步槍）
  C: { n: ['炮', '砲'], hp: 3, dist: 10 * C, range: 5.2 * C, min: 4 * C, dmg: 2, mass: 1.5, w: '迫擊炮', snd: 'mortar', proj: 'shell', reload: 1, indirect: true, moveLine: true, ortho: true, splash: 1.5 * C },   // 只能打同一橫線／直線上的目標；   // 只能沿橫線／直線移動；射後需裝填 1 回合（期間完全不能攻擊，包括近戰）；上下左右相鄰受 1/2 傷害、斜角受 1/4（無條件捨去到 ¼ 心）
  // 相／象：防空＋近戰；自動攔截落點在 2.5 格內的火箭／砲彈（冷卻 2 回合，不影響近戰）；近戰 1 心、射程 1.5 格；只能走田字（象眼被塞就過不去）
  // 仕／士：護衛，近距離手槍；限九宮斜走一格；帥被直接攻擊時，相鄰的士衝出來替帥擋下
  G: { n: ['仕', '士'], hp: 3, dist: 1.5 * C, range: 1.5 * C, min: 0,     dmg: 1, mass: 1.5, w: '手槍', snd: 'pistol', proj: 'bullet', palace: true, guard: true },   // 近距離（相鄰與斜角）手槍 1 心
  E: { n: ['相', '象'], hp: 3, dist: 3 * C,   range: 3 * C,   melee: 1.5 * C, tian: true, min: 0,     dmg: 1, mass: 1.5, w: '手槍',   snd: 'pistol', proj: 'bullet', aa: 2.5 * C, reload: 1 },
  P: { n: ['兵', '卒'], hp: 2, dist: 1 * C,   range: 1.8 * C, min: 0,     dmg: 1, mass: 1,   w: '步槍',   snd: 'rifle',  proj: 'bullet', tag: '（未過河）', locked: true },
  // 士官長（兵過河後空投補給升官）：自由移動（每次最多 2 格），血量 2 → 3，強化霰彈槍 9 發彈丸呈扇形，越近命中越多（傷害與命中數成正比，全中 2.5 心）
  P2: { n: ['士官長', '士官長'], face: ['兵', '卒'], hp: 3, dist: 2 * C, range: 3 * C, min: 0,    dmg: 2.5, mass: 1,   w: '強化霰彈槍', snd: 'shotgun', proj: 'pellets', tag: '（過河升官）',
        pellets: 9, cone: 30 * Math.PI / 180 },
};
// 傌、俥的主武器冷卻時，改用步槍（炮冷卻時完全不能攻擊）（1 心、射程 1.8 格、直射）
const RIFLE = { w: '步槍', snd: 'rifle', proj: 'bullet', dmg: 1, range: 1.8 * C, min: 0, indirect: false, splash: 0, reload: 0, backup: false, ortho: false, knightOnly: false, isAlt: true };
for (const T of Object.values(TYPES)) if (T.backup) T.alt = { ...T, ...RIFLE };
// 每方各有一份兵種數值表 TT[side][key]（含強化卡的加成）；棋子的 p.T 指向自己那方的表
let mods = [{}, {}], cardCount = [{}, {}], turnsPlayed = [0, 0];
const TT = [{}, {}];
function buildTypes(side) {
  for (const k of Object.keys(TYPES)) {
    const T = { ...TYPES[k], id: k }, m = mods[side][k] || {};
    for (const [st, v] of Object.entries(m)) T[st] = (T[st] || 0) + v;
    if (T.reload !== undefined) T.reload = Math.max(0, T.reload);
    if (T.min !== undefined) T.min = Math.max(0, T.min);
    delete T.alt; if (T.backup) T.alt = { ...T, ...RIFLE };
    TT[side][k] = T;
  }
}
function rebuildAll() { buildTypes(0); buildTypes(1); for (const p of pieces) p.T = TT[p.s][p.T.id]; }
const weaponOf = a => a.cd > 0 && a.T.alt ? a.T.alt : a.T;   // 目前可用的武器（單一武器的棋子）
// 目標 b 相對於 (x,y) 是否剛好在「日」字位置
function tianOffset(x, y, b) {   // 目標 b 是否在 (x,y) 的田字對角點（斜 2 格）
  const dx = Math.abs(b.x - x) / C, dy = Math.abs(b.y - y) / C;
  return Math.abs(dx - 2) < 0.05 && Math.abs(dy - 2) < 0.05;
}
function knightOffset(x, y, b) {
  const dx = Math.abs(b.x - x) / C, dy = Math.abs(b.y - y) / C, rx = Math.round(dx), ry = Math.round(dy);
  return Math.abs(dx - rx) < 0.05 && Math.abs(dy - ry) < 0.05 && ((rx === 1 && ry === 2) || (rx === 2 && ry === 1));
}
// 打目標 b 時實際使用的武器：傌——日字位置且火箭已裝填完用火箭，其餘用步槍；炮——冷卻中不能攻擊；俥——冷卻中改用步槍
function weaponFor(a, b, x = a.x, y = a.y) {
  const T = a.T;
  if (!T.alt) return T;
  if (T.knight) return !a.cd && knightOffset(x, y, b) ? T : T.alt;
  return a.cd > 0 ? T.alt : T;
}
const LAYOUT = [['K',4,9],['G',3,9],['G',5,9],['R',0,9],['R',8,9],['N',1,9],['N',7,9],['E',2,9],['E',6,9],['C',1,7],['C',7,7],
                ['P',0,6],['P',2,6],['P',4,6],['P',6,6],['P',8,6]];

let pieces, turn, state, mover, timer, fx, winner, targets;
let moved = false, firedPiece = null, sel = null, origin = null;   // moved：本回合已移動；sel：目前選取的棋子 {p, moves 可走的點, dest 目的地, scan 原地可攻擊}
// 對戰模式：local＝同裝置並排、face＝同裝置面對面（黑方文字倒轉）、online＝兩台裝置連線
let mode = 'local', mySide = 0, conn = null, pendingEnd = null;
const online = () => mode === 'online';
const myTurn = () => (!online() && mode !== 'ai') || turn === mySide;   // 連線或對電腦時，只能操作自己那方
const viewFlip = () => online() && mySide === 1;   // 連線時執黑的一方，棋盤轉 180° 讓自己在下方
// 文字朝向：讓該方玩家讀起來是正的
const textAng = side => (viewFlip() ? Math.PI : 0) + (mode === 'face' && side === 1 ? Math.PI : 0);
const $ = id => document.getElementById(id);
const alive = () => pieces.filter(p => p.hp > 0);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const setMsg = s => $('info').textContent = s;
// 血量與傷害都以愛心計，最小單位 ¼ 心
const quarter = x => Math.floor(x * 4 + 1e-9) / 4;
const hearts = n => {
  const w = Math.floor(n), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[n - w] || '';
  return w ? '♥'.repeat(w) + f : f + '♥';
};
const rnd = k => (Math.random() - 0.5) * 2 * k;

// ----- 音效（Web Audio 即時合成，不需要音檔） -----
// 每種武器由數層聲音疊成：槍口爆裂（crack，高頻瞬間）＋槍身（body，中頻）＋低頻悶響（thump）＋環境殘響（reverb 尾音），
// 並依真實武器特性調整：手槍短促、步槍有超音速爆音與回音、機槍連發、霰彈槍低沉巨響＋拉槍栓、火箭筒噴射呼嘯、迫擊砲「咚」＋落下哨音。
const SFX = (() => {
  let ac = null, master = null, dry = null, wet = null, conv = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('rc-mute') === '1'; } catch (e) {}
  const VOL = 0.75;
  const rv = (x = 0.05) => x * (0.92 + Math.random() * 0.16);   // 每次發聲略有變化，連發才不會像錄音重播
  // 建立音訊鏈：dry／wet（殘響）→ 總音量 → 壓縮器（防爆音、讓巨響更有厚度）→ 輸出
  function setup(ctx) {
    ac = ctx;
    master = ctx.createGain(); master.gain.value = muted ? 0 : VOL;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
    master.connect(comp); comp.connect(ctx.destination);
    dry = ctx.createGain(); dry.connect(master);
    // 殘響：用指數衰減的噪音當脈衝響應（約 1.8 秒，高頻衰減較快，像戶外空曠處的回音）
    const len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c); let lp = 0;
      for (let i = 0; i < len; i++) {
        const k = i / len, a = (Math.random() * 2 - 1) * Math.pow(1 - k, 3.2);
        lp += (a - lp) * (0.9 - 0.8 * k);   // 越到尾端越悶
        d[i] = lp;
      }
    }
    conv = ctx.createConvolver(); conv.buffer = ir;
    wet = ctx.createGain(); wet.gain.value = 0.9; wet.connect(conv); conv.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);

// ----- 粒子特效 -----
let parts = [], decals = [], shake = 0, lastBump = 0;
// o: {k 種類, sp 速度, life 壽命, size, col, dir 方向（省略＝四散）, spread 擴散角, drag 阻力}
function emit(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = o.dir === undefined ? Math.random() * Math.PI * 2 : o.dir + rnd((o.spread || 1) / 2);
    const sp = o.sp * (0.3 + Math.random() * 0.7), L = o.life * (0.6 + Math.random() * 0.4);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: L, L, size: o.size * (0.6 + Math.random() * 0.6),
                 col: o.col, k: o.k, drag: o.drag ?? 3, rot: Math.random() * 6 });
  }
}
function flashAt(x, y, size, t = 0.12) { parts.push({ x, y, vx: 0, vy: 0, t, L: t, size, k: 'flash', drag: 0 }); }
function muzzle(x, y, dir, big) {
  flashAt(x, y, big ? 26 : 16);
  emit(x, y, big ? 10 : 5, { k: 'spark', sp: 260, life: 0.18, size: 2, col: '#ffe066', dir, spread: 0.9 });
  emit(x, y, big ? 6 : 2, { k: 'smoke', sp: 50, life: 0.7, size: 8, col: '#888', dir, spread: 1.2 });
}
function explode(x, y, big) {
  flashAt(x, y, big ? 60 : 34, big ? 0.16 : 0.1);
  parts.push({ x, y, vx: 0, vy: 0, t: 0.35, L: 0.35, size: big ? 75 : 42, k: 'ring', drag: 0 });
  emit(x, y, big ? 40 : 18, { k: 'spark', sp: big ? 340 : 230, life: 0.5, size: 2.5, col: '#ffd23f' });
  emit(x, y, big ? 16 : 8,  { k: 'fire',  sp: big ? 120 : 80,  life: 0.45, size: big ? 16 : 11, col: '#ff7a1a' });
  emit(x, y, big ? 18 : 8,  { k: 'smoke', sp: big ? 60 : 40,   life: big ? 1.5 : 1, size: big ? 18 : 12, col: '#555' });
  if (big) emit(x, y, 12, { k: 'debris', sp: 280, life: 0.9, size: 5, col: '#3a2a1a', drag: 2.5 });
  decals.push({ x: x + rnd(4), y: y + rnd(4), r: big ? 30 + Math.random() * 6 : 13 });
  shake = Math.max(shake, big ? 12 : 5);
}
function bumpFX(x, y, v) {
  const now = performance.now();
  if (now - lastBump > 60) { SFX.play('bump', v); lastBump = now; }
  if (v > 250) emit(x, y, 6, { k: 'spark', sp: 180, life: 0.25, size: 2, col: '#fff3b0' });
  if (v > 450) shake = Math.max(shake, 3);
}
function updParts(dt) {
  for (const p of parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f;
    if (p.k === 'smoke') p.y -= 12 * dt;
  }
  parts = parts.filter(p => p.t > 0);
  shake = Math.max(0, shake - 40 * dt);
}

// ----- 物理 -----
const inRiver = p => p.y > gy(4) && p.y < gy(5);
function bounds(p) {
  if (p.T.palace) return p.s ? [gx(3), gy(0), gx(5), gy(2)] : [gx(3), gy(7), gx(5), gy(9)];
  return [R, R, W - R, H - R];
}
function moveOne(p, dt) {
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 0) {
    const ns = Math.max(0, sp - FR * (inRiver(p) ? RIVER_FR : 1) * dt);
    p.vx *= ns / sp; p.vy *= ns / sp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  const [x0, y0, x1, y1] = bounds(p);
  let bump = 0;   // 撞牆速度（給音效用）
  if (p.x < x0) { p.x = x0; bump = Math.abs(p.vx); p.vx = -p.vx * 0.6; }
  if (p.x > x1) { p.x = x1; bump = Math.abs(p.vx); p.vx = -p.vx * 0.6; }
  if (p.y < y0) { p.y = y0; bump = Math.max(bump, Math.abs(p.vy)); p.vy = -p.vy * 0.6; }
  if (p.y > y1) { p.y = y1; bump = Math.max(bump, Math.abs(p.vy)); p.vy = -p.vy * 0.6; }
  return bump;
}
function physics(dt) {
  const ps = alive();
  for (const p of ps) {
    const bump = moveOne(p, dt), sp = Math.hypot(p.vx, p.vy);
    if (bump > 100) bumpFX(p.x, p.y, bump);
    if (sp > 40) p.hd = Math.atan2(p.vy, p.vx);
    if (sp > 150 && Math.random() < 0.15)   // 車尾揚起塵土（河道是水花）
      emit(p.x - Math.cos(p.hd) * R, p.y - Math.sin(p.hd) * R, 1,
           { k: 'smoke', sp: 30, life: 0.6, size: 7, col: inRiver(p) ? '#9cc3d5' : '#b89a6a', dir: p.hd + Math.PI, spread: 1.5 });
  }
}
// ----- 定點移動：每次移動都停在棋盤交叉點上 -----
const fwd = p => p.s ? 1 : -1;
const crossed = (s, y) => s ? y > gy(4.5) : y < gy(4.5);
// 只能走一格的情況：未過河的兵（只能往前）
const oneStep = p => p.T.locked;
// 這顆棋子可以停的交叉點（帥／將限九宮）
function pointsFor(p) {
  const pts = [], [x0, y0, x1, y1] = bounds(p);
  for (let c = 0; c <= 8; c++)
    for (let r = 0; r <= 9; r++) {
      const x = gx(c), y = gy(r);
      if (p.T.aa && crossed(p.s, y)) continue;   // 相／象不能過河
      if (p.T.palace && (x < x0 - 1 || x > x1 + 1 || y < y0 - 1 || y > y1 + 1)) continue;
      pts.push([x, y]);
    }
  return pts;
}
// 可以走的點：空的交叉點、在移動力範圍內、直線路徑不穿過其他棋子（不會撞開別人）
function pathClear(p, x, y) {
  const dx = x - p.x, dy = y - p.y, d2 = dx * dx + dy * dy;
  return alive().every(q => {
    if (q === p) return true;
    const t = Math.max(0, Math.min(1, ((q.x - p.x) * dx + (q.y - p.y) * dy) / d2));
    return Math.hypot(q.x - (p.x + t * dx), q.y - (p.y + t * dy)) >= R * 1.8;

// ===== 對戰模式與連線 =====
// 連線做法：輪到誰，誰的裝置就是「主控」——它算物理、把動作（出發／開火）送給對方播放動畫，
// 回合結束時送出完整局面快照，對方直接套用，兩台裝置就不會因浮點誤差而越跑越不同步。
function snapshot() {
  return { turn, winner, md: mods, tp: turnsPlayed, ps: pieces.map(p => [p.x, p.y, p.hp, p.cd, p.T.id === 'P2' ? 1 : 0, p.hd]) };
}
function applySnap(sn) {
  if (JSON.stringify(sn.md) !== JSON.stringify(mods)) { mods = JSON.parse(JSON.stringify(sn.md)); buildTypes(0); buildTypes(1); }
  turnsPlayed = sn.tp.slice();
  sn.ps.forEach(([x, y, hp, cd, pr, hd], i) => {
    const p = pieces[i];
    Object.assign(p, { x, y, hp, cd, hd, vx: 0, vy: 0, cdFresh: false });
    p.T = pr ? TT[p.s].P2 : TT[p.s][p.t];
  });
  turn = sn.turn; winner = sn.winner;
}
function applyEnd() {
  const sn = pendingEnd; pendingEnd = null;
  const before = pieces.map(p => p.hp);
  applySnap(sn);
  let healed = false;   // 對方回合開始時的戰地醫療也播特效
  pieces.forEach((p, i) => { if (p.hp > before[i] && p.hp > 0) { healFX(p, p.hp - before[i]); healed = true; } });
  if (healed) SFX.play('heal');
  targets = []; moved = false; sel = null; setSkip(false);
  if (winner !== null) { state = 'over'; SFX.play('win'); }
  else { state = 'aim'; setMsg(myTurn() ? '輪到你了！拉動己方棋子移動，停下後點選要攻擊的敵人。' : '等待對手操作…'); }
  updateHeader();
  if (winner === null) maybeTurnPick();
}
function send(m) { if (online() && conn && conn.open) conn.send(m); }
function onNet(m) {
  if (m.t === 'reset') { reset(); setMsg('對手重新開始了一局。'); return; }
  if (m.t === 'cfg') { if (cardsOn !== m.cards) { cardsOn = m.cards; showCardsBtn(); } reset(); return; }   // 連線時以房主的強化卡牌設定為準
  if (m.t === 'card') { incoming.push(m); drainIncoming(); return; }
  if (m.t === 'launch') {
    const p = pieces[m.i];
    p.vx = m.vx; p.vy = m.vy; p.hd = Math.atan2(m.vy, m.vx); mover = p;
    SFX.play('launch', 0.7); state = 'moving'; setMsg('對手出發！');
  } else if (m.t === 'undo') {   // 對手取消移動：棋子退回出發點
    const p = pieces[m.i];
    applyUndo({ p, x: m.x, y: m.y, hd: m.hd, hp: m.hp, T: m.pr ? TT[p.s].P2 : TT[p.s][p.t] });
    snaps = null; mover = null; state = 'wait'; setMsg('對手取消了移動，重新選擇中…');
  } else if (m.t === 'shoot') {
    applySnap(m.snap);   // 先對齊停下的位置再播開火
    state = 'fire'; timer = 0.5; mover = pieces[m.a];
    shoot(pieces[m.a], pieces[m.b]);
  } else if (m.t === 'end') {
    pendingEnd = m.snap;
    if (!['moving', 'settle', 'fire'].includes(state)) applyEnd();   // 否則等動畫播完（onStop／endTurn）再套用
  }
}
function restart() {
  reset();
  send({ t: 'reset' });
}
function setMode(m, side = 0) {
  if (m !== 'online' && conn) { try { conn.close(); } catch (e) {} conn = null; }
  mode = m; mySide = side; pendingEnd = null;
  reset();
  $('lobby').hidden = true;
}
const netStatus = s => $('netStatus').innerHTML = s;

// --- PeerJS（WebRTC 點對點；房號＝在免費的 PeerJS 公用伺服器上的 ID） ---
let peer = null;
const peerId = code => 'rc-chess-b-' + code;
function loadPeer() {
  return window.Peer ? Promise.resolve() : new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'vendor/peerjs.min.js'; sc.onload = ok; sc.onerror = () => fail(new Error('載入連線模組失敗'));
    document.head.appendChild(sc);
  });
}
const netErr = e => ({ network: '連不上配對伺服器，請檢查網路', 'server-error': '配對伺服器暫時無法使用，請稍後再試',
                       'browser-incompatible': '這個瀏覽器不支援連線對戰' })[e.type] || (e.type || e.message);
function bindConn(c, side) {
  conn = c;
  c.on('data', onNet);
  c.on('open', () => {
    mode = 'online'; mySide = side; pendingEnd = null;
    reset(); $('lobby').hidden = true;
    if (side === 0) send({ t: 'cfg', cards: cardsOn });
    netStatus('✅ 已連線');
    setMsg(side === 0 ? '對手已加入！你執紅先手，開始吧。' : '已加入房間！你執黑，等待紅方先手…');
  });
  c.on('close', () => { if (conn === c) { conn = null; setMsg('⚠ 連線中斷，可按 ☰ 重新建立房間。'); netStatus('⚠ 連線中斷'); } });
  c.on('error', e => netStatus('⚠ ' + e.message));
}
async function host() {
  netStatus('建立房間中…');
  try { await loadPeer(); } catch (e) { netStatus('⚠ ' + e.message); return; }
  if (peer) peer.destroy();
  const code = String(1000 + Math.floor(Math.random() * 9000));
  peer = new Peer(peerId(code));
  peer.on('open', () => {
    const link = location.href.split('?')[0] + '?room=' + code;
    netStatus(`房號 <b style="font-size:22px">${code}</b>，等待對手加入…<br>或把連結傳給對方：<br><small>${link}</small>` +
              `<br><button id="copyLink" style="width:auto">複製連結</button>`);
    $('copyLink').onclick = () => navigator.clipboard?.writeText(link).then(() => $('copyLink').textContent = '已複製 ✓');
  });
  peer.on('connection', c => { if (conn && conn.open) { c.close(); return; } bindConn(c, 0); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') host();   // 房號撞到，換一個
    else netStatus('⚠ 無法建立房間：' + netErr(e));
  });
}
async function join(code) {
  code = String(code).trim();
  if (!/^\d{4}$/.test(code)) { netStatus('請輸入 4 位數房號'); return; }
  netStatus('連線中…');
  try { await loadPeer(); } catch (e) { netStatus('⚠ ' + e.message); return; }
  if (peer) peer.destroy();
  peer = new Peer();
  peer.on('open', () => bindConn(peer.connect(peerId(code), { reliable: true, serialization: 'json' }), 1));
  peer.on('error', e => netStatus(e.type === 'peer-unavailable' ? '⚠ 找不到這個房間，請確認房號' : '⚠ 連線失敗：' + netErr(e)));
}
// 測試用：?bc=房名&side=0|1 用 BroadcastChannel 在同一台電腦的兩個分頁之間連線
function bcConnect(room, side) {
  const ch = new BroadcastChannel('rc-chess-' + room), hs = {};
  const c = { open: false, send: m => ch.postMessage(m), close() { ch.close(); }, on: (ev, fn) => hs[ev] = fn };
  ch.onmessage = e => {
    if (e.data === 'hello' || e.data === 'ack') {
      if (e.data === 'hello') ch.postMessage('ack');
      if (!c.open) { c.open = true; hs.open && hs.open(); }
    } else hs.data && hs.data(e.data);
  };
  bindConn(c, side);
  ch.postMessage('hello');
}

$('menu').onclick = () => { SFX.init(); $('lobby').hidden = false; };
$('mClose').onclick = () => $('lobby').hidden = true;
$('mLocal').onclick = () => setMode('local');
$('mFace').onclick = () => setMode('face');
$('mHost').onclick = () => host();
$('mJoin').onclick = () => join($('roomIn').value);
$('roomIn').onkeydown = e => { if (e.key === 'Enter') join($('roomIn').value); };
document.querySelectorAll('#lobby .lv button').forEach(b => b.onclick = () => {
  aiLevel = +b.dataset.lv; setMode('ai');
  setMsg(`對電腦（${AI_LEVELS[aiLevel]}）：你執紅先手，點選棋子開始。`);
});
$('mRestart').onclick = () => { restart(); $('lobby').hidden = true; };

reset(true);
requestAnimationFrame(loop);
{ const q = new URLSearchParams(location.search); if (!q.has('bc') && !q.has('nolog')) setTimeout(() => showLog(false), 300); }   // nolog／bc：測試用，不自動彈出更新內容
{
  const q = new URLSearchParams(location.search);
  if (q.get('bc')) bcConnect(q.get('bc'), +q.get('side') || 0);
  else if (q.get('room')) { $('lobby').hidden = false; $('roomIn').value = q.get('room'); join(q.get('room')); }
  else $('lobby').hidden = false;   // 一開始先選對戰模式
}
</script>
