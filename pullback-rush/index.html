<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pullback Rush</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=2026-10-23.03">
</head>
<body>
<div id="wrap">
  <button id="newver" class="newver" hidden>🔔 有新版本，點此重新整理</button>
  <canvas id="stage" width="560" height="1000"></canvas>
  <button id="btn-skip-top" class="small skip flip">不移動・直接瞄準</button>
  <div id="bar">
    <button id="btn-quit" class="small">← 離開</button>
    <button id="btn-skip" class="small skip">不移動・直接瞄準</button>
    <button class="mute small"></button>
  </div>

  <section id="screen-start" class="screen">
    <h1>PULLBACK<br><span>RUSH</span></h1>
    <p class="sub">Pull Back. Power Up. Take Down.</p>
    <ul class="how">
      <li>🎮 兩人輪流，每方 <b>2 台戰車</b>，紅隊（下）先攻；可選「同側輪流」或「面對面」（手機平放）</li>
      <li>👆 <b>① 移動：</b>點選一台己方戰車，向後拖曳蓄力，放手後朝反方向衝刺；撞<b>增益寶箱</b>可加射程、威力或修復</li>
      <li>🎯 <b>② 瞄準：</b>再向後拖曳決定砲管方向，放手後進入<b>罰球式瞄準條</b>，在綠區按下才準；<b>越近越好打，越遠越容易偏</b></li>
      <li>🏰 主堡<b>正面城門是弱點（傷害×2）</b>，<b>四角鋼灰塔樓是裝甲（傷害−1，會被彈開）</b>，其餘城牆一般傷害</li>
      <li>💥 砲彈也能擊毀敵方戰車；擊毀敵方主堡或全部戰車者獲勝</li>
    </ul>
    <button id="btn-mode" class="small mode"></button>
    <button id="btn-start" class="big">開始遊戲</button>
    <button class="mute small"></button>
    <div id="ver"></div>
  </section>

  <section id="screen-result" class="screen hidden">
    <div id="result-top" class="flip hidden"><h2 id="result-title-top"></h2><p id="result-sub-top" class="sub"></p></div>
    <h2 id="result-title"></h2>
    <p id="result-sub" class="sub"></p>
    <button id="btn-restart" class="big">再來一局</button>
    <button id="btn-menu" class="small">回到開始畫面</button>
  </section>
</div>
<script src="js/version.js?v=2026-10-23.03"></script>
<script src="js/config.js?v=2026-10-23.03"></script>
<script src="js/audio.js?v=2026-10-23.03"></script>
<script src="js/game.js?v=2026-10-23.03"></script>
<script src="js/update.js?v=2026-10-23.03"></script>
</body>
</html>
