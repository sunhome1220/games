<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pullback Rush</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="stage" width="560" height="1000"></canvas>
  <div id="bar">
    <button id="btn-quit" class="small">← 離開</button>
    <button id="btn-skip" class="small skip">不移動・直接瞄準</button>
    <button class="mute small"></button>
  </div>

  <section id="screen-start" class="screen">
    <h1>PULLBACK<br><span>RUSH</span></h1>
    <p class="sub">Pull Back. Power Up. Take Down.</p>
    <ul class="how">
      <li>🎮 兩人同一支手機輪流操作，紅隊（下）先攻</li>
      <li>👆 <b>① 移動：</b>按住自己的戰車向後拖曳蓄力，放手後朝反方向衝刺（會撞到障礙物反彈）</li>
      <li>🎯 <b>② 瞄準：</b>停下後再按住戰車向後拖曳，砲管會朝反方向轉動，放手開砲</li>
      <li>🏰 主堡必須在虛線<b>射程圈</b>內才打得到，砲彈會被障礙物與戰車擋住</li>
      <li>❤️ 先讓對方主堡生命值歸零者獲勝</li>
    </ul>
    <button id="btn-start" class="big">開始遊戲</button>
    <button class="mute small"></button>
  </section>

  <section id="screen-result" class="screen hidden">
    <h2 id="result-title"></h2>
    <p id="result-sub" class="sub"></p>
    <button id="btn-restart" class="big">再來一局</button>
    <button id="btn-menu" class="small">回到開始畫面</button>
  </section>
</div>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
